<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 引入 FontAwesome 图标库 -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<title>太阳系探索 - 3D穿越课堂</title>
<style>
/* --- 基础重置 --- */
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; font-family: 'Microsoft YaHei', sans-serif; }
#pano-container { width: 100vw; height: 100vh; position: relative; }

/* --- 加载动画 --- */
.loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; z-index: 100; background: #0a0a1a; }
.loading.hidden { display: none; }
.spinner { width: 40px; height: 40px; border: 3px solid rgba(102,126,234,0.3); border-top-color: #667eea; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* --- 统一布局 UI --- */
.ui-layer { position: absolute; z-index: 20; pointer-events: none; }
.ui-layer * { pointer-events: auto; } /* 允许点击交互 */

/* 1. 左上角用户信息 */
#identity-hud {
  top: 20px; left: 20px;
  background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px);
  color: #fff; padding: 12px 16px; border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.1);
  min-width: 140px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
}
#identity-hud .title { font-weight: bold; font-size: 14px; display: flex; align-items: center; gap: 6px; color: #FFD700; }
#identity-hud .sub { font-size: 11px; color: rgba(255,255,255,0.6); margin-top: 4px; }

/* 2. NPC 列表 (新增，放在身份牌下方) */
#npc-list {
  top: 100px; left: 20px;
  display: flex; flex-direction: column; gap: 8px;
}
.npc-btn {
  background: rgba(20, 30, 60, 0.8); border: 1px solid rgba(102,126,234,0.4);
  color: #e0e7ff; padding: 8px 16px; border-radius: 20px; font-size: 13px;
  cursor: pointer; transition: 0.2s; backdrop-filter: blur(4px);
  white-space: nowrap; text-align: left;
}
.npc-btn:hover { background: rgba(102,126,234,0.5); transform: translateX(4px); }

/* 3. 中央场景指示牌 */
#scene-info {
  bottom: 120px; left: 50%; transform: translateX(-50%);
  background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(4px);
  color: #fff; padding: 8px 20px; border-radius: 20px;
  font-size: 14px; text-align: center; border: 1px solid rgba(255,255,255,0.1);
  white-space: nowrap;
}

/* 4. 底部选择按钮 */
#choice-bar {
  bottom: 30px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; max-width: 80%;
}
.choice-btn {
  background: rgba(65, 88, 208, 0.85); backdrop-filter: blur(4px);
  border: 1px solid rgba(255,255,255,0.2); color: #fff;
  padding: 10px 20px; border-radius: 25px; font-size: 14px;
  cursor: pointer; transition: 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}
.choice-btn:hover { background: rgba(65, 88, 208, 1); transform: scale(1.02); }

/* 5. 对话气泡 */
#dialogue-bubble {
  bottom: 180px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
  color: #fff; padding: 14px 24px; border-radius: 16px;
  max-width: 500px; text-align: center; font-size: 15px; line-height: 1.5;
  display: none; border: 1px solid rgba(255,215,0,0.2);
  white-space: pre-wrap;
}

/* 🟢 手机端才显示音频按钮 */
@media (max-width: 768px) {
  #enable-audio { display: block !important; }
}
</style>
</head>
<body>

<!-- 加载层 -->
<div id="loading" class="loading">
  <div class="spinner"></div>
  <p>穿越时空隧道中...</p>
</div>

<!-- 3D 容器 (最底层) -->
<div id="pano-container"></div>

<!-- UI 层 (悬浮在上面) -->
<div id="identity-hud" class="ui-layer">
  <div class="title"><i class="fa-solid fa-helmet-safety"></i> 穿越者</div>
  <div class="sub">📍 恐龙世界 | 滚轮/滑动切换</div>
</div>

<div id="npc-list" class="ui-layer"></div>

<div id="scene-info" class="ui-layer">🦕 正在探索...</div>

<div id="dialogue-bubble" class="ui-layer"></div>

<div id="choice-bar" class="ui-layer"></div>

<!-- 🟢 手机端音频激活按钮 -->
<button id="enable-audio" style="position:fixed;top:15px;right:15px;z-index:20;background:rgba(0,0,0,0.7);color:#fff;border:1px solid rgba(255,255,255,0.2);padding:6px 14px;border-radius:20px;font-size:12px;backdrop-filter:blur(4px);cursor:pointer;display:none;">
  🔊 开启语音
</button>

<!-- 核心库与引擎 -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="panorama-viewer.js"></script>

<!-- 控制脚本 -->
<script>
let courseData = null;
let currentSceneIdx = 0;
let viewer = null;

async function init() {
  try {
    const res = await fetch('images/3d_b62ee405.json');
    courseData = await res.json();
    document.getElementById('loading').classList.add('hidden');
    loadScene(0);
    bindInteractionEvents(); // 🟢 绑定滚轮 + 触摸滑动事件
  } catch(e) {
    document.getElementById('loading').innerHTML = '<p>❌ 场景加载失败，请检查 JSON 路径。</p>';
  }
}

function loadScene(idx) {
  if (!courseData?.scenes) return;
  currentSceneIdx = Math.max(0, Math.min(idx, courseData.scenes.length - 1));
  const scene = courseData.scenes[currentSceneIdx];
  
  // 更新中央指示牌
  document.getElementById('scene-info').innerHTML = `📍 ${scene.name} · ${courseData.scenes.length}个场景 | 滚轮/滑动切换`;
  
  // 更新底部选项按钮
  const choiceBar = document.getElementById('choice-bar');
  choiceBar.innerHTML = (scene.choices || []).map((c, i) =>
    `<button class="choice-btn" onclick="showKnowledge('${c.text}', '${c.knowledge}')">${c.text}</button>`
  ).join('');
  
  // 加载全景图
  if (viewer) viewer.dispose();
  if (scene.panorama_url) {
    viewer = new PanoramaViewer('pano-container', {
      imageUrl: scene.panorama_url,
      autoRotate: true
    });
  }
  
  // 🟢 重要：尝试朗读（由语音模块决定是否拦截）
  speakText(`${scene.name}。${scene.description || ''}`);
}

// ==========================================
// 🟢 交互事件：同时支持 电脑滚轮 和 手机滑动
// ==========================================
function bindInteractionEvents() {
  const container = document.getElementById('pano-container');
  if (!container) return;
  
  let wheelTimeout;
  // 1. 电脑端：鼠标滚轮切换
  container.addEventListener('wheel', (e) => {
    e.preventDefault();
    clearTimeout(wheelTimeout);
    wheelTimeout = setTimeout(() => {
      const scenes = courseData?.scenes || [];
      if (scenes.length <= 1) return;
      let nextIdx = currentSceneIdx;
      if (e.deltaY > 0) {
        nextIdx = (currentSceneIdx + 1) % scenes.length;
      } else {
        nextIdx = (currentSceneIdx - 1 + scenes.length) % scenes.length;
      }
      loadScene(nextIdx);
    }, 300);
  }, { passive: false });

  // 2. 手机端：手指上下滑动切换
  let touchStartY = 0;
  let touchEndY = 0;
  
  container.addEventListener('touchstart', (e) => {
    touchStartY = e.changedTouches[0].screenY;
  }, { passive: true });

  container.addEventListener('touchend', (e) => {
    touchEndY = e.changedTouches[0].screenY;
    handleSwipe();
  }, { passive: true });

  // 在 bindInteractionEvents 函数内部，找到 handleSwipe，替换为这个：
	function handleSwipe() {
		const swipeDistance = touchStartY - touchEndY;
		const minSwipeDistance = 80; // 加大阈值，防止跟拖拽冲突

		if (Math.abs(swipeDistance) < minSwipeDistance) {
			return; // 滑动距离小，认为是拖拽旋转视角，不触发切屏
		}
		
		// 滑动距离够大，判定为切屏
		const scenes = courseData?.scenes || [];
		if (scenes.length <= 1) return;
		let nextIdx = currentSceneIdx;
		if (swipeDistance > 0) {
			nextIdx = (currentSceneIdx + 1) % scenes.length;
		} else {
			nextIdx = (currentSceneIdx - 1 + scenes.length) % scenes.length;
		}
		loadScene(nextIdx);
	}
}

// ==========================================
// 🟢 语音系统：电脑自动播放 + 手机点击激活
// ==========================================

// 1. 判断是否为手机
function isMobileDevice() {
    return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
}

var audioActivated = false; // 是否已激活音频

// 2. 核心朗读函数 (必须定义在调用之前)
function speakText(text) {
    if (!text) return;
    if (!window.speechSynthesis) return;

    // 🟢 修改拦截逻辑：如果是手机，且音频未解锁，才拦截
    if (isMobileDevice() && !audioUnlocked) {
        console.log("🔇 手机音频未解锁，请点击右上角【开启语音】按钮");
        return; 
    }

    // 正常朗读
    speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'zh-CN';
    utterance.rate = 0.9;
    speechSynthesis.speak(utterance);
}

// NPC 对话
function talkNPC(name, dialogue) {
  const bubble = document.getElementById('dialogue-bubble');
  bubble.innerHTML = `<strong>${name}：</strong><br>${dialogue}`;
  bubble.style.display = 'block';
  setTimeout(() => bubble.style.display = 'none', 8000);
  speakText(dialogue);
}

// 知识卡片
function showKnowledge(text, knowledge) {
  const bubble = document.getElementById('dialogue-bubble');
  bubble.innerHTML = `<strong>📖 ${text}</strong><br><span style="font-size:13px;color:#aaa;margin-top:8px;display:block;">${knowledge}</span>`;
  bubble.style.display = 'block';
  setTimeout(() => bubble.style.display = 'none', 8000);
  speakText(knowledge);
}

// ==========================================
// 🟢 真正的“声音解锁”按钮（手机端专用）
// ==========================================
var audioUnlocked = false;

document.getElementById('enable-audio').onclick = function() {
    // 最暴力的唤醒方式：用浏览器原生的语音系统直接读一句话
    if (window.speechSynthesis) {
        // 终止所有尚未完成的语音
        window.speechSynthesis.cancel();
        // 发送一个极度简短的无声指令（解决 Chrome/Safari 严格策略）
        var u = new SpeechSynthesisUtterance(" ");
        u.volume = 0; // 确保静音
        window.speechSynthesis.speak(u);
        
        // 标记为已解锁
        audioUnlocked = true;
        
        // 按钮消失
        this.remove();
        console.log("🔓 手机语音已解锁");
        
        // 为了验证，可以尝试立刻读一句话
        // setTimeout(() => { speakText("语音已开启"); }, 500);
    }
};

window.onload = init;
</script>
</body>
</html>
